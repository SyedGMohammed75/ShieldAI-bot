<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldAI - AI Insurance Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-container { height: calc(100vh - 160px); }
        .bubble-ai { background: #F3F4F6; border-radius: 12px 12px 12px 0; }
        .bubble-user { background: #2563EB; color: white; border-radius: 12px 12px 0 12px; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl">🛡️</div>
            <h1 class="text-2xl font-bold text-gray-800">ShieldAI</h1>
        </div>
        <div class="text-sm font-semibold text-green-600 flex items-center">
            <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> System Online
        </div>
    </header>

    <main class="flex-grow container mx-auto max-w-4xl p-6 flex flex-col">
        <!-- Chat Area -->
        <div id="chat-box" class="chat-container bg-white border rounded-xl shadow-lg p-6 overflow-y-auto mb-4 space-y-4">
            <!-- Initial Message -->
            <div class="flex justify-start">
                <div class="bubble-ai px-4 py-2 max-w-[80%] shadow-sm">
                    <p class="text-gray-800 italic">Connecting to ShieldAI...</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="flex space-x-4">
            <input id="user-input" type="text" placeholder="Type your message..." 
                class="flex-grow border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
            <button id="send-btn" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-md">
                Send
            </button>
        </div>
    </main>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let userId = localStorage.getItem('shield_user_id');

        if (!userId) {
            userId = 'web_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('shield_user_id', userId);
        }

        async function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            bubble.className = `${role === 'user' ? 'bubble-user' : 'bubble-ai'} px-4 py-2 max-w-[80%] shadow-sm`;
            bubble.textContent = text;
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            addMessage(text, 'user');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, message: text })
                });
                const data = await response.json();
                addMessage(data.reply, 'ai');
            } catch (error) {
                console.error('Error:', error);
                addMessage("I'm having trouble connecting to my brain right now.", 'ai');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Start Onboarding
        window.onload = async () => {
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, message: "/start" })
                });
                const data = await response.json();
                chatBox.innerHTML = ''; // Clear connecting message
                addMessage(data.reply, 'ai');
            } catch (e) {
                chatBox.innerHTML = '';
                addMessage("Welcome to ShieldAI! How can I help you today?", 'ai');
            }
        };
    </script>
</body>
</html>
